[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-workspace"
version = "0.1.0"
description = "Deterministic filesystem kernel for persistent scientific autoresearch"
requires-python = ">=3.10"
dependencies = [
  "netCDF4>=1.6",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
  "xarray>=2023.1",
]

[project.optional-dependencies]
optuna = ["optuna>=4.9,<5"]

[tool.setuptools.packages.find]
where = ["src"]
