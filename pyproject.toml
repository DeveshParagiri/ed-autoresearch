[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-workspace"
version = "0.1.0"
description = "Focused model-generation and ILAMB evaluation tools for ED-Fire"
requires-python = ">=3.10"
dependencies = [
  "cftime==1.6.5",
  "h5py==3.16.0",
  "matplotlib==3.10.9",
  "netCDF4>=1.6",
  "numpy==2.2.6",
  "optuna>=4.9,<5",
  "PyYAML>=6.0",
  "requests>=2.31",
  "SciencePlots==2.2.2",
  "scipy==1.15.2",
  "tomli>=2.0; python_version < '3.11'",
  "xarray==2025.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]
