[project]
name = "ed-fire-autoresearch"
version = "0.1.0"
description = "A one-artifact autoresearch workspace for ED-Fire"
requires-python = ">=3.10"
dependencies = [
  "ILAMB==2.7.3",
  "matplotlib==3.10.9",
  "netCDF4>=1.6,<2",
  "numpy==2.2.6",
  "optuna>=4.9,<5",
  "SciencePlots==2.2.2",
]

[project.scripts]
ar = "scripts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[tool.uv]
package = true
