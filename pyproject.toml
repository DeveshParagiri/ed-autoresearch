[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-workspace"
version = "0.1.0"
description = "Deterministic filesystem kernel for persistent scientific autoresearch"
requires-python = ">=3.10"
dependencies = [
  "netCDF4>=1.6",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
  "xarray>=2023.1",
]

[project.optional-dependencies]
optuna = ["optuna>=4.9,<5"]
historical = [
  "cftime==1.6.5",
  "h5py==3.16.0",
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "SciencePlots==2.2.2",
  "scipy==1.15.2",
  "xarray==2025.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]
